name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package integration
        run: |
          zip -r ha_home_maintenance.zip custom_components/ha_home_maintenance \
            --exclude "*/node_modules/*" \
            --exclude "*/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "*/panel/src/*" \
            --exclude "*/panel/localize/*" \
            --exclude "*/panel/build.mjs" \
            --exclude "*/panel/package*.json" \
            --exclude "*/panel/tsconfig.json" \
            --exclude "*/panel/logs/*" \
            --exclude "*/logs/*" \
            --exclude "*/specs/*" \
            --exclude "*/.claude/*" \
            --exclude "*/.env*" \
            --exclude "*.log" \
            --exclude "*/.gitignore" \
            --exclude "*/.DS_Store"

      - name: Verify no personal files in archive
        run: |
          if unzip -Z1 ha_home_maintenance.zip \
            | grep -E '(^|/)(logs|specs|node_modules|__pycache__|\.claude)/|\.env|\.log$|\.pyc$'; then
            echo "::error::Release archive contains files that must not be published"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: ha_home_maintenance.zip
          generate_release_notes: true
